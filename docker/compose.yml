services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123123
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  elasticsearch:
    build: ./elasticsearch
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: false
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
    mem_limit: 4g
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  doris-fe:
    image: apache/doris:fe-4.0.7
    container_name: doris-fe
    hostname: doris-fe
    restart: unless-stopped
    ports:
      - "8030:8030"
      - "9010:9010"
      - "9030:9030"
    environment:
      FE_SERVERS: "fe1:172.30.80.2:9010"
      FE_ID: "1"
      JACOCO_COVERAGE_OPT: "-Xms1024m -Xmx2048m -XX:-UseContainerSupport"
    volumes:
      - doris-fe-meta:/opt/apache-doris/fe/doris-meta
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P9030 -uroot -e 'SHOW FRONTENDS' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      doris-network:
        ipv4_address: 172.30.80.2

  doris-be:
    image: apache/doris:be-4.0.7
    container_name: doris-be
    hostname: doris-be
    restart: unless-stopped
    ports:
      - "8040:8040"
      - "9050:9050"
    environment:
      FE_SERVERS: "fe1:172.30.80.2:9010"
      BE_ADDR: "172.30.80.3:9050"
    volumes:
      - doris-be-storage:/opt/apache-doris/be/storage
    depends_on:
      doris-fe:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "mysql -h172.30.80.2 -P9030 -uroot -N -e 'SHOW BACKENDS' 2>/dev/null | grep -q '172.30.80.3.*true'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      doris-network:
        ipv4_address: 172.30.80.3

volumes:
  mysql-data:
  redis-data:
  es-data:
  doris-fe-meta:
  doris-be-storage:

networks:
  doris-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.80.0/24
