logging:
  file:
    enable: true
    level: INFO
    path: logs
    # === 2026-06-09 改造：去掉了 rotation / retention
    # 原因：现在日志按 conversation_id 分文件（logs/conv-{id}.log），
    #       每个文件就是"一次会话的完整轨迹"，不应该被截断。
    #       app.log 兜底文件同理：保留全部历史方便排查。
    # === 改造结束 ===
  console:
    enable: true
    level: INFO

db_meta:
  host: localhost
  port: 3306
  user: root
  password: 123321
  database: meta

db_dw:
  host: localhost
  port: 3306
  user: root
  password: 123321
  database: warehouse

qdrant:
  host: localhost
  port: 6333
  embedding_size: 1024

es:
  host: localhost
  port: 9200
  index_name: data_agent

embedding:
  base_url: https://api.siliconflow.cn/v1
  api_key: ${oc.env:SILICONFLOW_API_KEY}
  model: BAAI/bge-large-zh-v1.5
  timeout: 30.0

llm:
  # === 2026-06-08 切换到 DeepSeek 官方 API（不再走 OpenRouter）===
  # 原配置（OpenRouter 走 deepseek-v4-flash 收费模型，api_key 硬编码有安全风险）：
  # model_name: deepseek/deepseek-v4-flash
  # api_key: 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
  # base_url: https://openrouter.ai/api/v1

  # 新配置（DeepSeek 官方，api_key 走 .env 占位符）：
  # 注意：DeepSeek 官方模型名是 "deepseek-chat"（对应 V3），不带 deepseek/ 前缀
  model_name: deepseek-v4-pro
  api_key: ${oc.env:DEEPSEEK_API_KEY}    # TODO: 用户需在 data-agent/.env 中填入真实 key
  base_url: https://api.deepseek.com/v1
  # === 切换结束 ===
