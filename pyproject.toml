description = "Intelligent data querying and analysis"
name = "data-agent"
requires-python = ">=3.12"
version = "0.1.0"

[dependency-groups]
dev = [
  "pyright>=1.1.410",
  "ruff>=0.15.16",
]

[tool.pyright]
venv = ".venv"
venvPath = "."
